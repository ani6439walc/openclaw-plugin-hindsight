name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Test Jules review automation
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - name: Verify packing restored the manifest
        run: git diff --exit-code -- package.json package-lock.json

  windows-queue:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify outbox filesystem behavior on Windows
        run: npx vitest run src/retain-outbox.test.ts src/retain-queue.test.ts --maxWorkers=2
